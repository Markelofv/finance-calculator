name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  # === Стадия тестов (в облаке GitHub) ===
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest test_finance_calculator.py -v

  # === Стадия деплоя (на вашей VM) ===
  deploy:
    needs: test
    runs-on: self-hosted  # Запуск на вашей виртуальной машине
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VM via rsync
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -avzr --delete --exclude='.git' --exclude='venv'
          path: ./
          remote_path: ${{ secrets.REMOTE_TARGET }}
          remote_host: ${{ secrets.REMOTE_HOST }}
          remote_user: ${{ secrets.REMOTE_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install dependencies on VM
        run: |
          cd ${{ secrets.REMOTE_TARGET }}
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
